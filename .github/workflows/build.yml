name: 'Build'

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5
        with:
          repository: '${{ github.repository }}'
          ref: '${{ github.ref }}'
          submodules: 'recursive'
          fetch-depth: 0

      - name: 'Setup Java 17'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 'Setup Android SDK'
        uses: android-actions/setup-android@v4
        with:
          # 默认值是 'tools platform-tools'，但 Google 已从 SDK 仓库下架旧的 tools 包，
          # 带上它会让 sdkmanager 以 exit 1 直接失败（Failed to find package 'tools'），构建还没开始就挂
          packages: 'platform-tools'

      - name: 'Install NDK / CMake / Build-Tools'
        run: |
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1" "build-tools;34.0.0"

      - name: 'Build with Gradle'
        working-directory: 'HybridFileXfer-Android'
        run: |
          sudo chmod -R 0755 .
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: 'Upload release apk'
        if: '${{ success() }}'
        uses: actions/upload-artifact@v5
        with:
          name: 'release-apk'
          path: '**/build/outputs/apk/release'
          compression-level: 9
          include-hidden-files: true

      - name: 'Upload debug apk'
        if: '${{ success() }}'
        uses: actions/upload-artifact@v5
        with:
          name: 'debug-apk'
          path: '**/build/outputs/apk/debug'
          compression-level: 9
          include-hidden-files: true

      - name: 'Upload mapping files'
        if: '${{ success() }}'
        uses: actions/upload-artifact@v5
        with:
          name: 'mappings'
          path: '**/build/outputs/mapping'
          compression-level: 9
          include-hidden-files: true

  # PC 端（Java 桌面客户端）不参与 Android 构建，没有这一步的话 PC 端的编译错误
  # 要等到打 tag 走 release.yml（或本地手跑 javac）才会暴露，而 push 时的绿勾会给人“整仓没问题”的假象。
  # 同时守住「core/ 与 nio/ 双端逐字节一致」这条约束。
  pc:
    name: 'PC 端编译 + 自检'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5

      - name: 'Setup Java 17'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: '校验 core/ 与 nio/ 双端逐字节一致'
        run: |
          set -euo pipefail
          diff -r HybridFileXfer-PC/src/top/weixiansen574/hybridfilexfer/core \
                  HybridFileXfer-Android/app/src/main/java/top/weixiansen574/hybridfilexfer/core \
            || { echo "::error::core/ 双端不一致：改一侧后必须同步另一侧（见 AGENTS.md 约束 1）"; exit 1; }
          diff -r HybridFileXfer-PC/src/top/weixiansen574/nio \
                  HybridFileXfer-Android/app/src/main/java/top/weixiansen574/nio \
            || { echo "::error::nio/ 双端不一致：改一侧后必须同步另一侧（见 AGENTS.md 约束 1）"; exit 1; }

      - name: 'Build HybridFileXfer.jar + 冒烟测试'
        working-directory: 'HybridFileXfer-PC'
        run: |
          set -euo pipefail
          rm -rf out/ci && mkdir -p out/ci
          # jetbrains annotations 已 vendor 在 libs/（Apache-2.0，仅编译期依赖），无需联网下载
          find src -name '*.java' > sources.txt
          javac -encoding UTF-8 -cp libs/annotations-24.0.1.jar -d out/ci @sources.txt
          cp src/messages_*.properties out/ci/
          # 必须带入 src/META-INF/MANIFEST.MF（含 Main-Class），否则 java -jar / start.exe 启动即退
          jar cfm HybridFileXfer.jar src/META-INF/MANIFEST.MF -C out/ci .
          # 冒烟测试：manifest 缺 Main-Class 不会让 javac/jar 报错，只能在运行时暴露
          java -jar HybridFileXfer.jar -v

      - name: '断点续传 / 文件名清洗 / 校验超时 自检'
        working-directory: 'HybridFileXfer-PC'
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -cp "libs/annotations-24.0.1.jar:out/ci" -d out/ci test/WatermarkProbe.java
          java -cp "libs/annotations-24.0.1.jar:out/ci" WatermarkProbe

      - name: '缓冲区块分配失败的降级 自检'
        working-directory: 'HybridFileXfer-PC'
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -cp "libs/annotations-24.0.1.jar:out/ci" -d out/ci test/BufferOomProbe.java
          # 必须限死堆外内存，否则「分配失败」这条路径不会触发
          java -XX:MaxDirectMemorySize=16m -cp "libs/annotations-24.0.1.jar:out/ci" BufferOomProbe