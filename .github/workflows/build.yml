name: 'Build'

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5
        with:
          repository: '${{ github.repository }}'
          ref: '${{ github.ref }}'
          submodules: 'recursive'
          fetch-depth: 0

      - name: 'Setup Java 17'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 'Setup Android SDK'
        uses: android-actions/setup-android@v4

      - name: 'Install NDK / CMake / Build-Tools'
        run: |
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1" "build-tools;34.0.0"

      - name: 'Build with Gradle'
        working-directory: 'HybridFileXfer-Android'
        run: |
          sudo chmod -R 0755 .
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: 'Upload release apk'
        if: '${{ success() }}'
        uses: actions/upload-artifact@v5
        with:
          name: 'release-apk'
          path: '**/build/outputs/apk/release'
          compression-level: 9
          include-hidden-files: true

      - name: 'Upload debug apk'
        if: '${{ success() }}'
        uses: actions/upload-artifact@v5
        with:
          name: 'debug-apk'
          path: '**/build/outputs/apk/debug'
          compression-level: 9
          include-hidden-files: true

      - name: 'Upload mapping files'
        if: '${{ success() }}'
        uses: actions/upload-artifact@v5
        with:
          name: 'mappings'
          path: '**/build/outputs/mapping'
          compression-level: 9
          include-hidden-files: true