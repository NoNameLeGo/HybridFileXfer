# 发布流水线：打 tag v* 或手动触发 workflow_dispatch 时，
# 构建 Android APK + PC 端（Windows 免安装包 / Linux jar）并发布到 GitHub Release。
#
# 可选：为 Android release APK 签名，在仓库 Settings → Secrets and variables → Actions 配置：
#   ANDROID_KEYSTORE_BASE64     —— keystore 文件的 base64（base64 -w0 keystore.jks）
#   ANDROID_KEYSTORE_PASSWORD   —— keystore 密码
#   ANDROID_KEY_ALIAS           —— 密钥别名
#   ANDROID_KEY_PASSWORD        —— 密钥密码
# 未配置时 release APK 以未签名形式发布（文件名带 -unsigned 后缀）。
name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（不含 v 前缀，如 3.0.1）'
        required: true
        default: '3.0.1'

permissions:
  contents: write

env:
  # tag 触发时取 tag 名（v3.0.1），手动触发时取输入
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  android:
    name: 'Android APK'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Java 17'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 'Setup Android SDK'
        uses: android-actions/setup-android@v3

      - name: 'Install NDK / CMake / Build-Tools'
        run: |
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1" "build-tools;34.0.0"

      - name: 'Cache Gradle'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('HybridFileXfer-Android/**/*.gradle', 'HybridFileXfer-Android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: 'Sync versionName from tag'
        working-directory: HybridFileXfer-Android
        run: |
          VER="${{ env.RELEASE_TAG }}"
          VER="${VER#v}"
          sed -i "s/versionName \".*\"/versionName \"${VER}\"/" app/build.gradle

      - name: 'Build APKs'
        working-directory: HybridFileXfer-Android
        run: |
          sudo chmod -R 0755 .
          ./gradlew --no-daemon assembleRelease assembleDebug

      - name: 'Collect APKs'
        shell: bash
        working-directory: HybridFileXfer-Android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/HybridFileXfer-android-${{ env.RELEASE_TAG }}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/dist/HybridFileXfer-android-${{ env.RELEASE_TAG }}-unsigned.apk"
          echo "collected:"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: 'Sign release APK (if secrets configured)'
        shell: bash
        working-directory: HybridFileXfer-Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置签名 secrets（ANDROID_KEYSTORE_BASE64 等），跳过签名，发布 unsigned APK"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          trap 'rm -f keystore.jks' EXIT
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks keystore.jks \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --out "$GITHUB_WORKSPACE/dist/HybridFileXfer-android-${{ env.RELEASE_TAG }}-release.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          echo "signed:"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: 'Upload dist artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist
          if-no-files-found: error

  pc-windows:
    name: 'PC Windows (jar + adb + launcher)'
    runs-on: windows-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Java 17'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 'Build HybridFileXfer.jar'
        shell: bash
        working-directory: HybridFileXfer-PC
        run: |
          set -euo pipefail
          rm -rf out/pc && mkdir -p out/pc
          # jetbrains annotations 是 PC 工程的外部依赖（本地由 IntelliJ 提供），从 Maven Central 获取
          curl -fsSL -o annotations.jar \
            https://repo1.maven.org/maven2/org/jetbrains/annotations/24.0.1/annotations-24.0.1.jar
          find src -name '*.java' > sources.txt
          javac -encoding UTF-8 -cp annotations.jar -d out/pc @sources.txt
          cp src/messages_*.properties out/pc/
          jar cf HybridFileXfer.jar -C out/pc .

      - name: 'Setup .NET SDK'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: 'Build Launcher (NativeAOT)'
        shell: bash
        run: |
          dotnet publish HybridFileXferLauncher/HybridFileXferLauncher.csproj \
            -c Release -r win-x64 -o launcher-out -p:PublishAot=true

      - name: 'Package Windows zip'
        shell: bash
        working-directory: HybridFileXfer-PC
        run: |
          set -euo pipefail
          VERSION="${{ env.RELEASE_TAG }}"
          PACK="HybridFileXfer-${VERSION}-windows-x64"
          mkdir -p "$GITHUB_WORKSPACE/dist/${PACK}"
          cp HybridFileXfer.jar "$GITHUB_WORKSPACE/dist/${PACK}/"
          cp adb.exe AdbWinApi.dll AdbWinUsbApi.dll "$GITHUB_WORKSPACE/dist/${PACK}/"
          cp "$GITHUB_WORKSPACE/script/"*.bat "$GITHUB_WORKSPACE/dist/${PACK}/"
          cp "$GITHUB_WORKSPACE/launcher-out/HybridFileXferLauncher.exe" "$GITHUB_WORKSPACE/dist/${PACK}/"
          cd "$GITHUB_WORKSPACE/dist"
          # Windows 上 zip 命令为 tar 的兼容模式，直接用它打 zip
          tar -a -c -f "${PACK}.zip" "${PACK}"
          rm -rf "${PACK}"
          ls -lh *.zip

      - name: 'Upload dist artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: dist-pc-windows
          path: dist
          if-no-files-found: error

  pc-linux:
    name: 'PC Linux (jar)'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Java 17'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 'Build HybridFileXfer.jar'
        working-directory: HybridFileXfer-PC
        run: |
          set -euo pipefail
          mkdir -p out/pc
          curl -fsSL -o annotations.jar \
            https://repo1.maven.org/maven2/org/jetbrains/annotations/24.0.1/annotations-24.0.1.jar
          find src -name '*.java' > sources.txt
          javac -encoding UTF-8 -cp annotations.jar -d out/pc @sources.txt
          cp src/messages_*.properties out/pc/
          jar cf HybridFileXfer.jar -C out/pc .

      - name: 'Package Linux zip'
        run: |
          set -euo pipefail
          VERSION="${{ env.RELEASE_TAG }}"
          PACK="HybridFileXfer-${VERSION}-linux"
          mkdir -p "dist/${PACK}"
          cp HybridFileXfer-PC/HybridFileXfer.jar "dist/${PACK}/"
          cp script/USB-forward.sh "dist/${PACK}/"
          # Linux 版不含 adb 二进制：README 说明需自行准备对应 CPU 架构的 adb，或使用 USB 网络共享
          printf '本包不含 adb 二进制。\n请自行准备对应 CPU 架构（x86_64/ARM64 等）的 adb 并放入本目录，\n或使用 USB 网络共享连接。\n' > "dist/${PACK}/README.txt"
          cd dist
          tar -c -z -f "${PACK}.tar.gz" "${PACK}"
          rm -rf "${PACK}"
          ls -lh *.tar.gz

      - name: 'Upload dist artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: dist-pc-linux
          path: dist
          if-no-files-found: error

  release:
    name: 'Publish GitHub Release'
    needs: [android, pc-windows, pc-linux]
    runs-on: ubuntu-latest
    steps:
      - name: 'Download dist artifacts'
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 'Flatten artifacts'
        run: |
          find dist -type f | sort
          # 把各 artifact 子目录中的文件平铺到 dist 根
          find dist -mindepth 2 -type f -exec mv -n {} dist/ \;

      - name: 'Create Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'HybridFileXfer ${{ env.RELEASE_TAG }}'
          body: |
            ## 下载
            - Android APK（debug / unsigned 或已签名 release）
            - PC Windows 免安装包（含 adb 与启动器）
            - PC Linux 包（jar，需自备 adb）

            > Android release APK 未配置签名 secrets 时以 `-unsigned` 后缀发布，安装前请自行校验。
          files: |
            dist/**/*.apk
            dist/**/*.zip
            dist/**/*.tar.gz
          generate_release_notes: true