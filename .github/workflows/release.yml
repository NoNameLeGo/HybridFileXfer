# 发布流水线：打 tag v* 或手动触发 workflow_dispatch 时，
# 构建 Android APK（含 antutu-turbo 变体）与 PC 端包，发布到 GitHub Release。
# 产物结构与父仓库 (weixiansen574/HybridFileXfer) 对齐：
#   app-release.apk / app-release_antutu-turbo.apk / HybridFileXfer-PC.zip
#
# Android 发布签名（必需，fork 各版本间可无缝覆盖安装）：
# 在仓库 Settings → Secrets and variables → Actions 配置以下 4 个 secret：
#   ANDROID_KEYSTORE_BASE64     —— keystore 文件的 base64（生成后妥善保管，丢失则旧版本无法升级安装）
#   ANDROID_KEYSTORE_PASSWORD   —— keystore 密码
#   ANDROID_KEY_ALIAS           —— 密钥别名
#   ANDROID_KEY_PASSWORD        —— 密钥密码
# 生成方法（本机 JDK 自带 keytool，无需安装构建环境）：
#   keytool -genkeypair -v -keystore release.jks -alias <alias> -keyalg RSA -keysize 4096 \
#     -validity 10000 -storepass <pass> -keypass <pass> -dname "CN=..., O=..., C=CN"
#   base64 -w0 release.jks   （Linux/macOS）或 PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.jks"))
name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（不含 v 前缀，如 3.0.1）'
        required: true
        default: '3.0.1'

permissions:
  contents: write

env:
  # tag 触发时取 tag 名（v3.0.1），手动触发时取输入
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  android:
    name: 'Android APK (release + antutu-turbo)'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Java 17'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 'Setup Android SDK'
        uses: android-actions/setup-android@v3

      - name: 'Install NDK / CMake / Build-Tools'
        run: |
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1" "build-tools;34.0.0"

      - name: 'Cache Gradle'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('HybridFileXfer-Android/**/*.gradle', 'HybridFileXfer-Android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: 'Sync versionName from tag'
        working-directory: HybridFileXfer-Android
        run: |
          VER="${{ env.RELEASE_TAG }}"
          VER="${VER#v}"
          sed -i "s/versionName \".*\"/versionName \"${VER}\"/" app/build.gradle

      - name: 'Build & sign APKs'
        shell: bash
        working-directory: HybridFileXfer-Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sudo chmod -R 0755 .
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::未配置 Android 发布签名 secrets（ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD）。"
            echo "::error::生成方法见 .github/workflows/release.yml 顶部注释，配置后重试。"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          trap 'rm -f keystore.jks' EXIT
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          # 1) 正式版（原包名）
          ./gradlew --no-daemon assembleRelease
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --out "$GITHUB_WORKSPACE/dist/app-release.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk

          # 2) antutu-turbo 变体（applicationId 改为 com.antutu.ABenchMark 的神秘加成😆），clean 后干净重建
          sed -i 's|applicationId "top.weixiansen574.hybridfilexfer"|applicationId "com.antutu.ABenchMark"|' app/build.gradle
          ./gradlew --no-daemon clean assembleRelease
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --out "$GITHUB_WORKSPACE/dist/app-release_antutu-turbo.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk

          echo "signed apks:"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: 'Upload dist artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist
          if-no-files-found: error

  pc-windows:
    name: 'PC Windows (HybridFileXfer-PC.zip)'
    runs-on: windows-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Java 17'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 'Build HybridFileXfer.jar'
        shell: bash
        working-directory: HybridFileXfer-PC
        run: |
          set -euo pipefail
          rm -rf out/pc && mkdir -p out/pc
          # jetbrains annotations 是 PC 工程的外部依赖（本地由 IntelliJ 提供），从 Maven Central 获取
          curl -fsSL -o annotations.jar \
            https://repo1.maven.org/maven2/org/jetbrains/annotations/24.0.1/annotations-24.0.1.jar
          find src -name '*.java' > sources.txt
          javac -encoding UTF-8 -cp annotations.jar -d out/pc @sources.txt
          cp src/messages_*.properties out/pc/
          jar cf HybridFileXfer.jar -C out/pc .

      - name: 'Setup .NET SDK'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: 'Build start.exe (NativeAOT launcher)'
        shell: bash
        run: |
          dotnet publish HybridFileXferLauncher/HybridFileXferLauncher.csproj \
            -c Release -r win-x64 -o launcher-out -p:PublishAot=true

      - name: 'Package HybridFileXfer-PC.zip'
        shell: bash
        working-directory: HybridFileXfer-PC
        run: |
          set -euo pipefail
          PACK="HybridFileXfer-PC"
          mkdir -p "$GITHUB_WORKSPACE/dist/${PACK}"
          cp HybridFileXfer.jar "$GITHUB_WORKSPACE/dist/${PACK}/"
          cp adb.exe AdbWinApi.dll AdbWinUsbApi.dll "$GITHUB_WORKSPACE/dist/${PACK}/"
          cp "$GITHUB_WORKSPACE/script/"*.bat "$GITHUB_WORKSPACE/script/"*.sh "$GITHUB_WORKSPACE/dist/${PACK}/"
          cp "$GITHUB_WORKSPACE/launcher-out/HybridFileXferLauncher.exe" "$GITHUB_WORKSPACE/dist/${PACK}/start.exe"
          cd "$GITHUB_WORKSPACE/dist"
          tar -a -c -f "HybridFileXfer-PC.zip" "${PACK}"
          rm -rf "${PACK}"
          ls -lh HybridFileXfer-PC.zip

      - name: 'Upload dist artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: dist-pc-windows
          path: dist
          if-no-files-found: error

  pc-linux:
    name: 'PC Linux (jar)'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Java 17'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 'Build HybridFileXfer.jar'
        working-directory: HybridFileXfer-PC
        run: |
          set -euo pipefail
          mkdir -p out/pc
          curl -fsSL -o annotations.jar \
            https://repo1.maven.org/maven2/org/jetbrains/annotations/24.0.1/annotations-24.0.1.jar
          find src -name '*.java' > sources.txt
          javac -encoding UTF-8 -cp annotations.jar -d out/pc @sources.txt
          cp src/messages_*.properties out/pc/
          jar cf HybridFileXfer.jar -C out/pc .

      - name: 'Package Linux tar.gz'
        run: |
          set -euo pipefail
          VERSION="${{ env.RELEASE_TAG }}"
          PACK="HybridFileXfer-${VERSION}-linux"
          mkdir -p "dist/${PACK}"
          cp HybridFileXfer-PC/HybridFileXfer.jar "dist/${PACK}/"
          cp script/USB-forward.sh "dist/${PACK}/"
          # Linux 版不含 adb 二进制：README 说明需自行准备对应 CPU 架构的 adb，或使用 USB 网络共享
          printf '本包不含 adb 二进制。\n请自行准备对应 CPU 架构（x86_64/ARM64 等）的 adb 并放入本目录，\n或使用 USB 网络共享连接。\n' > "dist/${PACK}/README.txt"
          cd dist
          tar -c -z -f "${PACK}.tar.gz" "${PACK}"
          rm -rf "${PACK}"
          ls -lh *.tar.gz

      - name: 'Upload dist artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: dist-pc-linux
          path: dist
          if-no-files-found: error

  release:
    name: 'Publish GitHub Release'
    needs: [android, pc-windows, pc-linux]
    runs-on: ubuntu-latest
    steps:
      - name: 'Download dist artifacts'
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 'Flatten artifacts'
        run: |
          find dist -type f | sort
          find dist -mindepth 2 -type f -exec mv -n {} dist/ \;

      - name: 'Create Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'HybridFileXfer ${{ env.RELEASE_TAG }}'
          body: |
            ## 下载
            - `app-release.apk` — Android 正式版（稳定签名，可覆盖安装本 fork 的历史版本）
            - `app-release_antutu-turbo.apk` — Android 变体（不同包名，可与正式版共存）
            - `HybridFileXfer-PC.zip` — PC 端免安装包（jar + adb + 启动器 start.exe + 启动脚本）
            - `HybridFileXfer-<版本>-linux.tar.gz` — PC Linux 包（jar，需自备对应架构 adb）

            > 说明：本 fork 使用独立发布签名，与父仓库 (weixiansen574) 版本互不覆盖，切换时需先卸载。
          files: |
            dist/**/*.apk
            dist/**/*.zip
            dist/**/*.tar.gz
          generate_release_notes: true